name: Rilis closed testing

# Dijalankan manual dari tab Actions, atau otomatis setiap push ke branch prod.
# Track tujuannya `alpha` (closed testing bawaan), diatur di app/build.gradle.kts.
on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build dan uji saja, jangan unggah ke Play"
        type: boolean
        default: false

# Satu rilis pada satu waktu: dua unggahan bersamaan akan bentrok nomor versi.
concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build dan unggah ke Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Pasang Gradle dengan cache
        uses: gradle/actions/setup-gradle@v4

      # Runner GitHub sudah membawa Android SDK sendiri, jadi tidak pakai
      # android-actions/setup-android: action itu memanggil `sdkmanager tools`,
      # sedangkan paket `tools` sudah dihapus dari repo SDK dan langkahnya gagal
      # sebelum build dimulai.
      #
      # compileSdk project ini 37 dan nama paketnya `android-37.0` (bukan
      # `android-37`), sesuai isi platforms/android-37.0/package.xml.
      - name: Pastikan platform Android 37 tersedia
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager_bin="$(ls -d "$sdk_root"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          fi
          # pipefail dimatikan khusus baris ini: `yes` mati oleh SIGPIPE saat
          # sdkmanager selesai membaca, dan itu bukan kegagalan lisensi.
          ( set +o pipefail; yes | "$sdkmanager_bin" --licenses > /dev/null )
          "$sdkmanager_bin" "platforms;android-37.0"

      - name: Tulis keystore upload
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"

      - name: Uji dan lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Build AAB bertanda tangan
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --console=plain

      - name: Unggah ke Play (closed testing)
        if: ${{ !inputs.dry_run }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_CICD_ACCOUNT_JSON }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:publishReleaseBundle --console=plain

      - name: Simpan AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
